# Headless checks of DungeonEclipse (tools/run_tests.sh).
# Every push and pull request: the project imports and parses, then the
# quick test set. Manually (Actions -> Run workflow) or nightly: everything.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full set (~45 min)"
        type: boolean
        default: true
  schedule:
    - cron: "17 3 * * *"

env:
  GODOT_VERSION: "4.3"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          chmod +x godot

      - name: Import the project
        run: |
          ~/godot/godot --headless --editor --quit || true
          ~/godot/godot --headless --editor --quit

      - name: Tests (quick on push, full on demand / nightly)
        env:
          GODOT: ~/godot/godot
          LOG_DIR: ${{ runner.temp }}/test-logs
        run: |
          export GODOT=$HOME/godot/godot
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.full }}" = "true" ]; then
            bash tools/run_tests.sh
          else
            bash tools/run_tests.sh --quick
          fi

      - name: Size budget
        if: always()
        run: |
          if [ -f tools/size_report.py ]; then python3 tools/size_report.py --check; fi

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: ${{ runner.temp }}/test-logs
